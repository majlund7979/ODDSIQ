# Prediction engine, daily shadow run (step 10, part 2). Reads the site's upcoming
# matches and odds from Neon, trains the step-5 model on football-data history and
# writes predictions and value bets to schema pe with the model in status "shadow",
# so nothing shows on the site. Needs the secret PE_DATABASE_URL (a Neon role that
# can read the site's tables and write schema pe; see pe/README.md). Without it the
# job is skipped. Scheduled runs on GitHub can be late or missing; a late run only
# predicts matches that have not started.

name: PE predict

on:
  schedule:
    - cron: "30 5 * * *"    # 07:30 Danish summer time
    - cron: "30 14 * * *"   # 16:30 Danish summer time
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read only, write nothing to the database
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pe-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pe
    steps:
      - name: Check secret
        id: secret
        working-directory: .
        env:
          PE_DATABASE_URL: ${{ secrets.PE_DATABASE_URL }}
        run: |
          if [ -z "$PE_DATABASE_URL" ]; then
            echo "::warning::PE_DATABASE_URL is not set, so the shadow run is skipped (see pe/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.ok == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pe/requirements.txt
      - if: steps.secret.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Fetch football-data history
        if: steps.secret.outputs.ok == 'true'
        run: curl -sSfL --retry 3 -o Matches.csv https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data-2000-2025/main/data/Matches.csv
      - name: Predict
        if: steps.secret.outputs.ok == 'true'
        env:
          PE_DATABASE_URL: ${{ secrets.PE_DATABASE_URL }}
        run: python scripts/run_daily.py --history Matches.csv ${{ inputs.dry_run && '--dry-run' || '' }}
